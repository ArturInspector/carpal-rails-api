services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: carpal_rails_e2e
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d carpal_rails_e2e"]
      interval: 2s
      timeout: 3s
      retries: 20
    ports:
      - "54329:5432"
    volumes:
      - carpal_rails_postgres:/var/lib/postgresql/data

  api:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/carpal_rails_e2e
      CORS_ORIGINS: http://localhost:3000
      JWT_SECRET: local-development-secret-change-me
      RAILS_ENV: development
    command: ["sh", "-c", "bin/rails db:prepare db:seed && exec bin/rails server -b 0.0.0.0 -p 8001"]
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8001:8001"

volumes:
  carpal_rails_postgres:
