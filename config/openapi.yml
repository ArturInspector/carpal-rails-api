openapi: 3.1.0
info:
  title: Carpal API
  version: 0.1.0
  description: Passwordless car rental marketplace API for Kyrgyzstan.
servers:
  - url: http://localhost:8001
paths:
  /health:
    get:
      operationId: getHealth
      responses:
        "200":
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /openapi.json:
    get:
      operationId: getOpenApi
      responses:
        "200":
          description: Implemented OpenAPI contract.
          content:
            application/json:
              schema:
                type: object
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          const: ok
    Error:
      type: object
      required: [detail]
      properties:
        detail:
          oneOf:
            - type: string
            - type: object
